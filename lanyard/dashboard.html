<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanyard Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens: dark is the default; light and system are opt-in ---------- */
  :root {
    color-scheme: dark;
    --page: #0a0f1c; --side: #0d1424; --surface: #131b2e; --raised: #1a2440;
    --ink: #e9edf7; --ink-2: #b9c1d6; --muted: #8590ab; --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.04);
    --grid: #232d47; --axis: #33405f;
    --brand: #5b8cff; --brand-2: #9bb5ff; --brand-wash: rgba(91,140,255,.14);
    --s-allow: #3987e5; --s-deny: #d95926;
    --good: #2fbf71; --good-ink: #5fd896; --good-wash: rgba(47,191,113,.14);
    --crit: #e5484d; --crit-ink: #ff8a8d; --crit-wash: rgba(229,72,77,.15);
    --warn: #f5b83d; --warn-ink: #ffcf70; --warn-wash: rgba(245,184,61,.14);
    --info-ink: #a9beff; --info-wash: rgba(91,140,255,.15);
    --badge: #f3f0e7; --badge-ink: #151a2b; --badge-muted: #6c7080; --badge-line: rgba(21,26,43,.12);
    --badge-shadow: 0 18px 40px -18px rgba(0,0,0,.7), 0 2px 0 rgba(255,255,255,.04) inset;
    --id-auth0: #5b8cff; --id-aws: #19b39b; --id-sub: #a78bfa; --id-red: #e5484d;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #eef0f5; --side: #e3e6ee; --surface: #fbfaf6; --raised: #ffffff;
    --ink: #12172a; --ink-2: #3d4459; --muted: #666c80; --line: rgba(18,23,42,.1); --hover: rgba(18,23,42,.04);
    --grid: #e2e4ea; --axis: #c3c8d4;
    --brand: #3a6df0; --brand-2: #7fa0f5; --brand-wash: #e1e9fd;
    --s-allow: #2a78d6; --s-deny: #eb6834;
    --good: #16a34a; --good-ink: #15803d; --good-wash: #dcfce7;
    --crit: #dc2626; --crit-ink: #b91c1c; --crit-wash: #fee2e2;
    --warn: #d97706; --warn-ink: #92400e; --warn-wash: #fef3c7;
    --info-ink: #1d4ed8; --info-wash: #dbeafe;
    --badge: #ffffff; --badge-shadow: 0 16px 34px -16px rgba(18,23,42,.35), 0 0 0 1px rgba(18,23,42,.06);
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
      color-scheme: light;
      --page: #eef0f5; --side: #e3e6ee; --surface: #fbfaf6; --raised: #ffffff;
      --ink: #12172a; --ink-2: #3d4459; --muted: #666c80; --line: rgba(18,23,42,.1); --hover: rgba(18,23,42,.04);
      --grid: #e2e4ea; --axis: #c3c8d4;
      --brand: #3a6df0; --brand-2: #7fa0f5; --brand-wash: #e1e9fd;
      --s-allow: #2a78d6; --s-deny: #eb6834;
      --good: #16a34a; --good-ink: #15803d; --good-wash: #dcfce7;
      --crit: #dc2626; --crit-ink: #b91c1c; --crit-wash: #fee2e2;
      --warn: #d97706; --warn-ink: #92400e; --warn-wash: #fef3c7;
      --info-ink: #1d4ed8; --info-wash: #dbeafe;
      --badge: #ffffff; --badge-shadow: 0 16px 34px -16px rgba(18,23,42,.35), 0 0 0 1px rgba(18,23,42,.06);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font: 14px/1.5 "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--brand-2); }
  .mono, code, pre { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  .mono { font-size: 12.5px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font: 600 11px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  /* ---------- frame ---------- */
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .side { background: var(--side); position: sticky; top: 0; height: 100vh; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
  .side::after { /* the lanyard strap */
    content: ""; position: absolute; top: 0; right: 0; width: 5px; height: 100%;
    background: repeating-linear-gradient(180deg, var(--brand) 0 14px, var(--brand-2) 14px 18px, var(--brand) 18px 32px);
    opacity: .9;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 22px; }
  .brand-mark { width: 34px; height: 42px; border-radius: 7px; background: var(--badge); position: relative; display: grid; place-items: end center; padding-bottom: 7px; box-shadow: var(--badge-shadow); }
  .brand-mark::before { content: ""; position: absolute; top: 5px; left: 50%; width: 12px; height: 3px; border-radius: 2px; background: var(--badge-muted); transform: translateX(-50%); opacity: .5; }
  .brand-mark i { width: 18px; height: 14px; border-radius: 3px; background: var(--brand); display: block; }
  .brand b { font-size: 18px; letter-spacing: -.01em; display: block; line-height: 1.1; }
  .brand span { font-size: 11.5px; color: var(--muted); }
  .nav { display: grid; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
  .nav a:hover { background: var(--hover); color: var(--ink); }
  .nav a.on { background: var(--brand-wash); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
  .nav svg { width: 17px; height: 17px; flex: none; }
  .nav .count { margin-left: auto; font: 700 11px/1.6 "JetBrains Mono", monospace; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--warn); color: #111; }
  .nav .count.red { background: var(--crit); color: #fff; }
  .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 8px 0; display: grid; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .side-foot .row { display: flex; justify-content: space-between; gap: 8px; }
  .side-foot .row span:first-child { color: var(--muted); }
  .side-foot .links { display: flex; gap: 12px; margin-top: 6px; }
  .side-foot button, .side-foot a { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: 12.5px; text-decoration: none; }
  .side-foot button:hover, .side-foot a:hover { color: var(--ink); }

  main { min-width: 0; }
  .top { padding: 26px 34px 6px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .top .titles { display: grid; gap: 8px; }
  .top h1 { font-size: 30px; margin: 0; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; font: 500 12px/1 "JetBrains Mono", monospace; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: var(--surface); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: beat 2s infinite; }
  .live.down i { background: var(--crit); animation: none; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(47,191,113,.55); } 70% { box-shadow: 0 0 0 8px rgba(47,191,113,0); } 100% { box-shadow: 0 0 0 0 rgba(47,191,113,0); } }
  .desc { color: var(--muted); margin: 6px 34px 22px; max-width: 780px; }
  #view { padding: 0 34px 48px; display: grid; gap: 20px; }

  /* ---------- panels ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; min-width: 0; }
  .panel-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .panel-h h3 { font-size: 15.5px; margin: 0; font-weight: 600; letter-spacing: -.005em; }
  .panel-h .sub { color: var(--muted); font-size: 12.5px; }
  .panel-h .right { margin-left: auto; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
  .grid2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .empty { color: var(--muted); padding: 26px 4px; text-align: center; }

  /* ---------- stat tiles: printed like turnstile counters ---------- */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; position: relative; overflow: hidden; }
  .tile .label { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 500; }
  .tile .label i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .tile .value { font-size: 40px; font-weight: 700; line-height: 1; margin: 12px 0 6px; letter-spacing: -.03em; }
  .tile .note { color: var(--muted); font-size: 12.5px; }
  .tile::after { content: ""; position: absolute; right: -18px; top: -18px; width: 64px; height: 64px; border-radius: 50%; border: 10px solid var(--hover); }

  /* ---------- charts ---------- */
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: var(--muted); font: 11px "JetBrains Mono", monospace; }
  .chart .lbl { fill: var(--ink-2); font: 500 12.5px "Space Grotesk", sans-serif; }
  .chart .val { fill: var(--ink); font: 600 12.5px "JetBrains Mono", monospace; }
  .tip { position: fixed; pointer-events: none; z-index: 50; background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.3); opacity: 0; transition: opacity .1s; min-width: 130px; }
  .tip.on { opacity: 1; }
  .tip .t { color: var(--muted); margin-bottom: 4px; font-family: "JetBrains Mono", monospace; font-size: 11.5px; }
  .tip .r { display: flex; align-items: center; gap: 6px; }
  .tip .r b { margin-left: auto; padding-left: 14px; font-family: "JetBrains Mono", monospace; }
  .tip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  /* ---------- decision pills: access-control vocabulary ---------- */
  .pill { display: inline-flex; align-items: center; gap: 5px; font: 700 10.5px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
  .pill.allow { color: var(--good-ink); background: var(--good-wash); }
  .pill.deny, .pill.error { color: var(--crit-ink); background: var(--crit-wash); }
  .pill.pending { color: var(--warn-ink); background: var(--warn-wash); }
  .pill.admin { color: var(--info-ink); background: var(--info-wash); }
  .btn { border: 1px solid var(--line); background: var(--raised); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { border-color: var(--axis); }
  .btn.danger { background: var(--crit); border-color: var(--crit); color: #fff; }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  .btn.danger:hover, .btn.good:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn:focus-visible, .door:focus-visible, .nav a:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }

  /* ---------- access log rows ---------- */
  .feed { display: grid; }
  .feed .ev { display: grid; grid-template-columns: 66px minmax(0, 132px) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 13px; }
  .feed .ev:first-child { border-top: 0; }
  .feed .ev .t { font: 12px "JetBrains Mono", monospace; color: var(--muted); }
  .feed .ev .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .ev .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .feed .ev .what b { font: 500 12.5px "JetBrains Mono", monospace; color: var(--ink); }

  /* ---------- the badge ---------- */
  .families { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 30px 24px; align-items: start; }
  .family { display: grid; gap: 18px; }
  .kids { display: grid; gap: 18px; margin-left: 26px; padding-left: 18px; border-left: 2px dashed var(--line); }
  .holder { display: grid; gap: 10px; }
  .badge { position: relative; padding-top: 30px; }
  .badge .strap { position: absolute; top: 0; left: 50%; width: 46px; height: 34px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent 0 8px, var(--strap, var(--brand)) 8px 38px, transparent 38px),
                repeating-linear-gradient(180deg, transparent 0 6px, rgba(255,255,255,.18) 6px 8px);
    clip-path: polygon(8px 0, 38px 0, 34px 100%, 12px 100%); }
  .badge .clip { position: absolute; top: 22px; left: 50%; width: 30px; height: 16px; transform: translateX(-50%); border-radius: 5px; background: linear-gradient(180deg, #d9dce4, #9aa0ae); box-shadow: 0 2px 4px rgba(0,0,0,.35); z-index: 2; }
  .badge .clip::after { content: ""; position: absolute; left: 50%; top: 5px; width: 12px; height: 4px; border-radius: 2px; background: #6b7180; transform: translateX(-50%); }
  .card { position: relative; background: var(--badge); color: var(--badge-ink); border-radius: 16px; box-shadow: var(--badge-shadow); overflow: hidden; }
  .card-inner { transition: filter .3s, opacity .3s; }
  .card .slot { position: absolute; top: 12px; left: 50%; width: 42px; height: 7px; border-radius: 4px; background: var(--page); opacity: .9; transform: translateX(-50%); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
  .card .band { margin-top: 26px; padding: 9px 18px; background: var(--idc); color: #fff; display: flex; align-items: center; justify-content: space-between; font: 600 10.5px/1 "JetBrains Mono", monospace; letter-spacing: .16em; text-transform: uppercase; }
  .card .band span:last-child { opacity: .85; }
  .card .body { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 16px 18px 6px; align-items: center; }
  .card .photo { width: 74px; height: 86px; border-radius: 10px; background: linear-gradient(160deg, color-mix(in srgb, var(--idc) 22%, var(--badge)), color-mix(in srgb, var(--idc) 40%, var(--badge))); display: grid; place-items: center; font: 700 26px/1 "Space Grotesk", sans-serif; color: color-mix(in srgb, var(--idc) 70%, #000); position: relative; }
  .card .photo svg { position: absolute; right: 6px; bottom: 6px; width: 16px; height: 16px; opacity: .55; }
  .card .nm { font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; overflow-wrap: anywhere; }
  .card .kind { color: var(--badge-muted); font-size: 12.5px; margin-top: 3px; }
  .card .no { margin-top: 8px; font: 600 11.5px/1 "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--badge-muted); }
  .card .sec { padding: 12px 18px 4px; }
  .card .sec-t { font: 600 10px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--badge-muted); margin-bottom: 8px; }
  .doors { display: flex; flex-wrap: wrap; gap: 6px; }
  .door { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px 6px 7px; border-radius: 7px; border: 1px solid var(--badge-line); background: transparent; color: var(--badge-ink); font: 500 11.5px/1 "JetBrains Mono", monospace; cursor: pointer; }
  .door i { width: 8px; height: 8px; border-radius: 2px; background: var(--good); }
  .door.blocked { background: rgba(229,72,77,.1); border-color: rgba(229,72,77,.35); text-decoration: line-through; }
  .door.blocked i { background: var(--crit); }
  .door.no-scope { color: var(--badge-muted); border-style: dashed; cursor: not-allowed; opacity: .7; }
  .door.no-scope i { background: transparent; border: 1px solid var(--badge-muted); }
  .door:not(.no-scope):hover { border-color: var(--badge-ink); }
  .card .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 18px; margin-top: 8px; border-top: 1px dashed var(--badge-line); }
  .card .facts b { display: block; font: 700 15px/1.1 "Space Grotesk", sans-serif; }
  .card .facts span { font-size: 11px; color: var(--badge-muted); }
  .card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 18px 14px; }
  .card .foot .id { font: 10.5px/1.3 "JetBrains Mono", monospace; color: var(--badge-muted); overflow-wrap: anywhere; max-width: 55%; }
  .card .barcode { height: 28px; flex: none; }
  .card .barcode rect { fill: var(--badge-ink); }
  .hazard { position: absolute; left: 0; right: 0; top: 0; z-index: 3; height: 26px; padding: 4px 10px; display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(-45deg, #f5b83d 0 12px, #1a1a1a 12px 16px); }
  .hazard span { background: #f5b83d; color: #111; padding: 2px 7px; border-radius: 3px; font: 700 10px/1.3 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.tainted .card .slot { top: 34px; }
  .badge.tainted .card .band { margin-top: 50px; }
  .stamp { position: absolute; z-index: 4; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-14deg); border: 4px solid var(--crit); color: var(--crit); padding: 6px 16px; border-radius: 10px;
    font: 700 28px/1 "Space Grotesk", sans-serif; letter-spacing: .14em; text-transform: uppercase; background: rgba(255,255,255,.55); box-shadow: 0 0 0 3px rgba(255,255,255,.4) inset; white-space: nowrap; pointer-events: none; }
  .stamp small { display: block; font: 600 10px/1.3 "JetBrains Mono", monospace; letter-spacing: .08em; text-align: center; margin-top: 4px; }
  .badge.void .card-inner { filter: grayscale(1); opacity: .55; }
  .badge.void .strap { --strap: #6b7180; }
  .holder .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .holder .actions .note { color: var(--muted); font-size: 12.5px; }
  .holder .swipes { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; }
  .holder .swipes .ev { grid-template-columns: 58px minmax(0, 1fr) auto; }
  .holder .swipes .ev .who { display: none; }

  /* ---------- security desk (approvals) ---------- */
  .desk { display: grid; gap: 14px; }
  .request { position: relative; border-radius: 14px; background: var(--surface); border: 1px solid var(--warn); padding: 16px 18px 16px 24px; display: grid; gap: 10px; animation: glow 1.6s ease-in-out infinite; overflow: hidden; }
  .request::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: repeating-linear-gradient(-45deg, #f5b83d 0 8px, #1a1a1a 8px 12px); }
  @keyframes glow { 50% { box-shadow: 0 0 0 5px var(--warn-wash); } }
  .request .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .request .row .btn:first-of-type { margin-left: auto; }
  .request .call { font: 500 13px/1.45 "JetBrains Mono", monospace; background: var(--page); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; overflow-wrap: anywhere; }

  /* ---------- tables, forms ---------- */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar input, .toolbar select { background: var(--page); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; }
  .toolbar input { flex: 1; min-width: 200px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font: 600 10.5px/1 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 10px 10px; white-space: nowrap; }
  td { padding: 10px; border-top: 1px dashed var(--line); vertical-align: top; }
  tbody tr.ev-row { cursor: pointer; }
  tbody tr.ev-row:hover td { background: var(--hover); }
  td.t { white-space: nowrap; color: var(--muted); font: 12px "JetBrains Mono", monospace; }
  tr.detail td { background: var(--hover); }
  pre.json { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--ink-2); }
  dl.kv { display: grid; grid-template-columns: 120px 1fr; gap: 9px 14px; margin: 0; font-size: 13px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .scopes { display: flex; flex-wrap: wrap; gap: 6px; }
  .scope { font: 500 11.5px/1 "JetBrains Mono", monospace; padding: 5px 7px; border-radius: 6px; background: var(--hover); border: 1px solid var(--line); }
  .checks { display: grid; gap: 12px; }
  .check { display: flex; gap: 11px; align-items: flex-start; }
  .check .ic { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700; }
  .check .ic.on { background: var(--good-wash); color: var(--good-ink); }
  .check .ic.off { background: var(--hover); color: var(--muted); }
  .check b { display: block; font-weight: 600; }
  .check span { color: var(--muted); font-size: 12.5px; }
  .cedar { display: grid; gap: 14px; }

  /* ---------- attack lab ---------- */
  .attacks { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .attack { position: relative; display: grid; gap: 10px; align-content: start; background: var(--page); border: 1px solid var(--line); border-radius: 14px; padding: 18px; overflow: hidden; }

  .attack p { margin: 0; font-size: 13px; color: var(--ink-2); }
  .attack .res { font: 12px/1.45 "JetBrains Mono", monospace; color: var(--ink-2); overflow-wrap: anywhere; border-radius: 9px; padding: 9px 11px; background: var(--hover); }
  .attack .verdict { position: absolute; right: 14px; top: 14px; transform: rotate(8deg); border: 3px solid currentColor; border-radius: 8px; padding: 3px 9px; font: 700 13px/1 "Space Grotesk", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .attack .verdict.ok { color: var(--good-ink); }

  .flow .col { display: grid; gap: 12px; align-content: start; }

  .node { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; }
  .node h4 { margin: 0; font-size: 14.5px; }
  .node p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

  .svc { display: inline-flex; align-items: center; gap: 6px; width: fit-content; font: 600 11px/1 "JetBrains Mono", monospace; padding: 5px 8px; border-radius: 6px; background: rgba(255,153,0,.13); color: #ffb547; border: 1px solid rgba(255,153,0,.3); }
  :root[data-theme="light"] .svc { background: #fff4e5; color: #9a5800; border-color: #f5c27a; }
  .svc.ext { background: var(--brand-wash); color: var(--info-ink); border-color: transparent; }
  .gate { border: 2px solid var(--brand); border-radius: 16px; padding: 14px; display: grid; gap: 10px; position: relative; background: linear-gradient(180deg, var(--brand-wash), transparent 40%); }
  .gate .gt { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gate .gt h4 { margin: 0; font-size: 16px; }
  .step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .step .n { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font: 700 14px/1 "Space Grotesk", sans-serif; }
  .step b { display: block; font-size: 13.5px; }
  .step span.d { display: block; font-size: 12.5px; color: var(--ink-2); margin: 2px 0 7px; }
  .step .fail { font: 500 11.5px/1.3 "JetBrains Mono", monospace; color: var(--crit-ink); }
  .under { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
  @media (max-width: 1150px) { .flow { grid-template-columns: minmax(0, 1fr); } .flow .arrow { transform: rotate(90deg); padding: 4px 0; } .under { grid-template-columns: minmax(0, 1fr); } }
  .toast { position: fixed; right: 22px; bottom: 22px; z-index: 60; background: var(--ink); color: var(--page); padding: 11px 15px; border-radius: 11px; font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }

  @media (max-width: 1150px) {

  }

    .side::after { width: 100%; height: 4px; top: auto; bottom: 0; background: repeating-linear-gradient(90deg, var(--brand) 0 14px, var(--brand-2) 14px 18px); }
    .brand { padding: 0 8px 0 0; } .brand span, .side-foot { display: none; }

  <main>

</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---------- state ----------
const S = { agents: [], approvals: [], events: [], policy: null, lastId: 0 };
const expanded = new Set();
const ICON = {
  auth0: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>',
  sub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5V13a5 5 0 0 0 5 5h4.5"/></svg>',
  aws: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/></svg>',
  red: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>',
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString([], { hour12: false });
const ago = ts => { const s = Math.max(0, Math.round(Date.now() / 1000 - ts)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : `${Math.floor(s / 3600)}h ago`; };
const agoSpan = ts => `<span class="ago" data-ts="${ts}">${ago(ts)}</span>`;
const DECISION_LABEL = { allow: "Granted", deny: "Denied", pending: "Held", admin: "Admin", error: "Error" };
const pill = d => `<span class="pill ${esc(d)}">${esc(DECISION_LABEL[d] || d)}</span>`;
const isCall = e => ["tools/call", "auth/aws", "auth/delegate", "tools/list", "initialize"].includes(e.method);

function action(e) {
  if (e.method === "tools/call") return e.tool;
  if (e.method === "admin") return e.tool ? `admin · ${e.tool}` : "admin";
  if (e.method === "auth/aws") return "sign-in (AWS IAM)";
  if (e.method === "auth/delegate") return "issue sub-agent badge";
  if (e.method === "attack") return `attack lab · ${e.tool}`;
  if (e.method === "initialize") return "session start";
  return e.method;
}
function denyCategory(reason) {
  const r = (reason || "").toLowerCase();
  if (r.includes("requires scope")) return "Missing permission";
  if (r.includes("cascade")) return "Parent agent revoked";
  if (r.includes("privilege escalation")) return "Privilege escalation";
  if (r.includes("revoked")) return "Badge revoked";
  if (r.includes("prompt injection")) return "Prompt injection";
  if (r.includes("blocked by admin") || r.includes("admin blocked")) return "Blocked by admin";
  if (r.includes("human reviewer") || r.includes("no approval")) return "Not approved";
  if (r.includes("sub-agents may never")) return "Sub-agent in production";
  if (r.includes("invalid token") || r.includes("bearer")) return "Forged or missing token";
  if (r.includes("not registered") || r.includes("sign-in failed")) return "Unknown identity";
  if (r.includes("default deny") || r.includes("not found")) return "No policy permits it";
  if (r.includes("unavailable")) return "Failed closed";
  return "Other";
}

// badge cosmetics derived from the agent id (stable across reloads)
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const badgeNo = id => { const h = hash(id).toString(16).toUpperCase().padStart(8, "0"); return `${h.slice(0, 2)}-${h.slice(2, 6)}`; };
function initials(name) {
  const last = String(name).split("›").pop().trim();
  const parts = last.split(/[-_\s]+/).filter(Boolean);
  return ((parts[0] || "?")[0] + ((parts[1] || "")[0] || "")).toUpperCase();
}
function barcode(id) {
  let h = hash(id), x = 0, bars = "";
  for (let i = 0; i < 34; i++) { h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0; const w = 1 + (h % 3); if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="28"/>`; x += w + 1; }
  return `<svg class="barcode" viewBox="0 0 ${x} 28" width="${x}" height="28" aria-hidden="true">${bars}</svg>`;
}
function identity(a) {
  if (a.identity === "red-team") return { color: "var(--id-red)", label: "RED TEAM", kind: "Attack lab identity", icon: ICON.red };
  if (a.identity === "delegated") return { color: "var(--id-sub)", label: "SUB-AGENT", kind: `Issued by ${nameOf(a.parent)}`, icon: ICON.sub };
  if (a.identity === "aws-iam") return { color: "var(--id-aws)", label: "AWS IAM", kind: "AWS IAM role · no stored secret", icon: ICON.aws };
  return { color: "var(--id-auth0)", label: "AUTH0", kind: "Auth0 · machine-to-machine", icon: ICON.auth0 };
}

// ---------- api ----------
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/"; throw new Error("signed out"); }
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600);
}
async function act(path, msg) {
  try { await api(path, { method: "POST" }); toast(msg); } catch (e) { toast(`Action failed (${e.message})`); }
  poll();
}
const nameOf = id => (S.agents.find(a => a.agent_id === id) || {}).name || id;
window.revokeAgent = id => act(`/api/agents/${encodeURIComponent(id)}/revoke`, `Badge revoked: ${nameOf(id)}. Its next call is blocked.`);
window.restoreAgent = id => act(`/api/agents/${encodeURIComponent(id)}/restore`, `Badge restored: ${nameOf(id)}.`);
window.untaint = id => act(`/api/agents/${encodeURIComponent(id)}/untaint`, `Taint cleared on ${nameOf(id)}.`);
window.toggleTool = (id, tool) => act(`/api/agents/${encodeURIComponent(id)}/tools/${encodeURIComponent(tool)}/toggle`, `Door updated: ${tool} for ${nameOf(id)}.`);
window.decide = (id, d) => act(`/api/approvals/${id}/${d}`, d === "approve" ? "Approved. The call is going through." : "Denied. The agent was told no.");

// ---------- charts ----------
const tip = document.getElementById("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.classList.add("on");
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => tip.classList.remove("on");
function niceTicks(max) {
  if (max <= 0) return [0, 1, 2];
  const raw = max / 3, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  const ticks = []; for (let v = 0; v <= max + step * 0.001 || ticks.length < 2; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}
function topRounded(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function decisionBuckets() {
  const now = Math.floor(Date.now() / 60000), n = 30, b = [];
  for (let i = n - 1; i >= 0; i--) b.push({ m: now - i, allow: 0, deny: 0 });
  const start = b[0].m;
  for (const e of S.events) {
    if (!isCall(e) || (e.decision !== "allow" && e.decision !== "deny")) continue;
    const i = Math.floor(e.ts / 60) - start;
    if (i >= 0 && i < n) b[i][e.decision]++;
  }
  return b;
}
function drawDecisions(el) {
  const b = decisionBuckets(), key = JSON.stringify(b) + el.clientWidth + theme;
  if (el._key === key) return; el._key = key;
  const W = Math.max(280, el.clientWidth), H = 230, L = 34, R = 6, T = 10, B = 26;
  const pw = W - L - R, ph = H - T - B, band = pw / b.length, bw = Math.min(24, band * 0.62);
  const max = Math.max(...b.map(d => d.allow + d.deny)), ticks = niceTicks(max), top = ticks[ticks.length - 1];
  const y = v => T + ph - (v / top) * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Granted and denied calls per minute, last 30 minutes">`;
  for (const t of ticks) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>`;
  b.forEach((d, i) => {
    const x = L + i * band + (band - bw) / 2;
    const ha = d.allow ? (d.allow / top) * ph : 0, hd = d.deny ? (d.deny / top) * ph : 0;
    if (ha) s += d.deny ? `<rect x="${x}" y="${y(0) - ha}" width="${bw}" height="${ha}" fill="var(--s-allow)"/>` : `<path d="${topRounded(x, y(0) - ha, bw, ha, 4)}" fill="var(--s-allow)"/>`;
    if (hd) { const gap = ha ? 2 : 0; s += `<path d="${topRounded(x, y(0) - ha - gap - hd, bw, hd, 4)}" fill="var(--s-deny)"/>`; }
    if (i % 5 === 4 || i === b.length - 1) {
      const lab = i === b.length - 1 ? "now" : new Date(d.m * 60000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
      s += `<text x="${L + i * band + band / 2}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
    }
    s += `<rect class="hit" data-i="${i}" x="${L + i * band}" y="${T}" width="${band}" height="${ph}" fill="transparent"/>`;
  });
  s += `</svg>`;
  if (max === 0) s += `<div class="empty" style="position:absolute;inset:0;display:grid;place-items:center;padding:0 0 26px 34px">No agent traffic in the last 30 minutes</div>`;
  el.innerHTML = s;
  el.onmousemove = ev => {
    const i = ev.target.dataset && ev.target.dataset.i; if (i === undefined) return hideTip();
    const d = b[+i], t = new Date(d.m * 60000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    showTip(`<div class="t">${t}</div><div class="r"><i style="background:var(--s-allow)"></i>Granted<b>${d.allow}</b></div><div class="r"><i style="background:var(--s-deny)"></i>Denied<b>${d.deny}</b></div>`, ev);
  };
  el.onmouseleave = hideTip;
}
function drawReasons(el) {
  const counts = {};
  for (const e of S.events) if (e.decision === "deny") { const c = denyCategory(e.reason); counts[c] = (counts[c] || 0) + 1; }
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 7);
  const key = JSON.stringify(rows) + el.clientWidth + theme;
  if (el._key === key) return; el._key = key;
  if (!rows.length) { el.innerHTML = `<div class="empty">No denials yet</div>`; el.onmousemove = null; return; }
  const total = rows.reduce((s, r) => s + r[1], 0), max = rows[0][1];
  const W = Math.max(260, el.clientWidth), rowH = 34, H = rows.length * rowH, labW = Math.min(176, W * 0.5), valW = 34;
  const pw = W - labW - valW;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Denied calls by reason">`;
  rows.forEach(([name, n], i) => {
    const yc = i * rowH + rowH / 2, w = Math.max(3, (n / max) * pw), x = labW, r = Math.min(4, w / 2);
    s += `<text class="lbl" x="0" y="${yc + 4}">${esc(name)}</text>`;
    s += `<path d="M${x},${yc - 10}H${x + w - r}Q${x + w},${yc - 10} ${x + w},${yc - 10 + r}V${yc + 10 - r}Q${x + w},${yc + 10} ${x + w - r},${yc + 10}H${x}Z" fill="var(--s-deny)"/>`;
    s += `<text class="val" x="${x + w + 8}" y="${yc + 4}">${n}</text>`;
    s += `<rect class="hit" data-i="${i}" x="0" y="${i * rowH}" width="${W}" height="${rowH}" fill="transparent"/>`;
  });
  el.innerHTML = s + `</svg>`;
  el.onmousemove = ev => {
    const i = ev.target.dataset && ev.target.dataset.i; if (i === undefined) return hideTip();
    const [name, n] = rows[+i];
    showTip(`<div class="t">${esc(name)}</div><div class="r">Denied calls<b>${n}</b></div><div class="r">Share<b>${Math.round((n / total) * 100)}%</b></div>`, ev);
  };
  el.onmouseleave = hideTip;
}

// ---------- shared fragments ----------
function feedHTML(events) {
  if (!events.length) return `<div class="empty">No swipes yet</div>`;
  return `<div class="feed">${events.map(e => `<div class="ev"><span class="t">${fmtTime(e.ts)}</span><span class="who">${esc(e.agent_name)}</span><span class="what"><b>${esc(action(e))}</b> · ${esc(e.reason)}</span>${pill(e.decision)}</div>`).join("")}</div>`;
}
function requestCard(a) {
  const args = Object.entries(a.arguments || {}).filter(([k]) => k !== "content").map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
  return `<div class="request">
    <div class="row"><span class="pill pending">Held at the desk</span><b>${esc(a.agent_name)}</b><span class="muted">wants through · waiting ${agoSpan(a.ts)}</span></div>
    <div class="call">${esc(a.tool)}(${esc(args)})</div>
    <div class="row"><span class="muted">The agent is paused until you decide. No answer within ${S.policy ? S.policy.approval_timeout : 120}s means no.</span>
      <button class="btn good" onclick="decide(${a.id},'approve')">Approve</button>
      <button class="btn danger" onclick="decide(${a.id},'deny')">Deny</button></div>
  </div>`;
}
function agentTree(agents) {
  const kids = {}, byId = new Set(agents.map(a => a.agent_id));
  agents.forEach(a => { const p = a.parent && byId.has(a.parent) ? a.parent : ""; (kids[p] = kids[p] || []).push(a); });
  // stable order, demo agents first: Auth0 agents, then AWS and AI agents, then simulated traffic, then the red team
  const rank = a => a.identity === "auth0" ? 0 : a.identity === "red-team" ? 3 : String(a.agent_id).includes("lanyard-sim-") ? 2 : 1;
  const roots = (kids[""] || []).slice().sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  return { roots, kids };
}
function setHTML(el, html) { if (el && el._html !== html) { el.innerHTML = html; el._html = html; } }

function badgeHTML(a) {
  const mine = S.events.filter(e => e.agent_id === a.agent_id);
  const granted = mine.filter(e => e.decision === "allow" && e.method === "tools/call").length;
  const denied = mine.filter(e => e.decision === "deny").length;
  const id = esc(JSON.stringify(a.agent_id)), idn = identity(a);
  const rev = a.revoked, cut = !rev && a.revoked_by_parent, taint = a.taint;
  const doors = a.tools.map(t => {
    const title = t.status === "no-scope" ? `No access: needs ${t.scope}` : t.status === "blocked" ? "Locked by an admin. Click to unlock." : `Open via ${t.scope}. Click to lock for this agent.`;
    const click = t.status === "no-scope" ? "disabled" : `onclick='toggleTool(${id}, ${esc(JSON.stringify(t.name))})'`;
    return `<button class="door ${t.status}" ${click} title="${esc(title)}"><i></i>${esc(t.name)}</button>`;
  }).join("");
  const stamp = rev ? `<div class="stamp">Revoked<small>${rev.grant_scopes ? "Auth0 grant removed" : "at the gateway"}</small></div>`
    : cut ? `<div class="stamp">Void<small>${esc(cut)} was revoked</small></div>` : "";
  const hazard = taint ? `<div class="hazard" title="${esc(taint.reason)}"><span>Tainted · ${esc(taint.reason.replace("read a prompt injection in ", "injection in "))}</span></div>` : "";
  const actions = rev ? `<button class="btn" onclick='restoreAgent(${id})'>Restore badge</button><span class="note">revoked ${agoSpan(rev.revoked_at)}</span>`
    : cut ? `<span class="note">Restore ${esc(cut)} to bring this badge back</span>`
    : `<button class="btn danger" onclick='revokeAgent(${id})'>Revoke badge</button><span class="note">last swipe ${agoSpan(a.last_seen)}</span>`;
  return `<div class="holder">
    <div class="badge ${rev || cut ? "void" : ""} ${taint ? "tainted" : ""}" style="--idc:${idn.color};--strap:${idn.color}">
      <div class="strap"></div><div class="clip"></div>
      <div class="card">
        ${hazard}${stamp}
        <div class="card-inner">
          <div class="slot"></div>
          <div class="band"><span>Pinecrest · Agent pass</span><span>${idn.label}</span></div>
          <div class="body">
            <div class="photo">${esc(initials(a.name))}${idn.icon}</div>
            <div><div class="nm">${esc(a.name)}</div><div class="kind">${esc(idn.kind)}</div><div class="no">No. ${badgeNo(a.agent_id)}</div></div>
          </div>
          <div class="sec"><div class="sec-t">Doors</div><div class="doors">${doors}</div></div>
          <div class="facts"><div><b>${granted}</b><span>granted</span></div><div><b>${denied}</b><span>denied</span></div><div><b>${(a.scopes || "").split(" ").filter(Boolean).length}</b><span>scopes</span></div></div>
          <div class="foot"><span class="id">${esc(a.agent_id)}</span>${barcode(a.agent_id)}</div>
        </div>
      </div>
    </div>
    <div class="actions">${taint ? `<button class="btn" onclick='untaint(${id})'>Clear taint</button>` : ""}${actions}</div>
    <div class="swipes">${feedHTML(mine.filter(e => e.method !== "tools/list").slice(-3).reverse())}</div>
  </div>`;
}

const ATTACK_RESULTS = {};
async function runAttack(id) {
  const btn = document.querySelector(`[data-attack="${id}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "Running…"; }
  try { ATTACK_RESULTS[id] = await api(`/api/attacks/${id}`, { method: "POST" }); }
  catch (e) { ATTACK_RESULTS[id] = { blocked: false, observed: `Request failed (${e.message})` }; }
  if (route === "attacks") VIEWS.attacks.update(true);
  poll();
}
window.runAttack = runAttack;
window.runAllAttacks = async () => { for (const a of (S.attacks || [])) await runAttack(a.id); };

function downloadCSV() {
  const rows = VIEWS.audit.filtered();
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = ["time,agent,agent_id,door,outcome,reason,latency_ms,detail"].concat(rows.map(e =>
    [new Date(e.ts * 1000).toISOString(), e.agent_name, e.agent_id, action(e), DECISION_LABEL[e.decision] || e.decision, e.reason, e.latency_ms, JSON.stringify(e.detail || {})].map(q).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `lanyard-access-log-${new Date().toISOString().slice(0, 19).replace(/:/g, "")}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- routing + loop ----------
let route = null;
function go() {
  const r = (location.hash.replace("#/", "") || "overview").split("?")[0];
  route = VIEWS[r] ? r : "overview";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === route));
  document.getElementById("title").textContent = VIEWS[route].title;
  document.getElementById("desc").textContent = VIEWS[route].desc;
  document.title = `${VIEWS[route].title} · Lanyard`;
  hideTip();
  VIEWS[route].mount(document.getElementById("view"));
  render();
}
function render() {
  if (!route) return;
  VIEWS[route].update();
  const n = S.approvals.length, ap = document.getElementById("n-approvals");
  ap.hidden = !n; ap.textContent = n;
  const rv = S.agents.filter(a => a.revoked).length, ar = document.getElementById("n-agents-rev");
  ar.hidden = !rv; ar.textContent = rv; ar.title = `${rv} revoked`;
}
async function poll() {
  try {
    const s = await api(`/api/state?after=${S.lastId}`);
    // the state was reset (log numbering started over): drop what we have and load fresh
    if (S.lastId > 0 && ((s.latest_id ?? S.lastId) < S.lastId || (!s.agents.length && !s.events.length && S.agents.length))) {
      S.events = []; S.lastId = 0; return poll();
    }
    S.agents = s.agents; S.approvals = s.approvals || [];
    if (s.events.length) { S.events = S.events.concat(s.events).slice(-3000); S.lastId = s.events[s.events.length - 1].id; }
    document.getElementById("live").classList.remove("down");
    document.getElementById("live-t").textContent = `LIVE · ${new Date().toLocaleTimeString([], { hour12: false })}`;
    render();
  } catch (e) {
    document.getElementById("live").classList.add("down"); document.getElementById("live-t").textContent = "RECONNECTING";
  }
}
async function loadPolicy() {
  try {
    S.policy = await api("/api/policy");
    document.getElementById("f-env").textContent = S.policy.environment;
    document.getElementById("f-store").textContent = S.policy.store;
    document.getElementById("f-engine").textContent = S.policy.cedar_policies && S.policy.cedar_policies.length ? "Cedar · AVP" : "Built-in";
    if (route === "policy") render();
  } catch (e) { /* retried on the next interval */ }
}

// theme: dark (default) -> light -> system
const THEMES = ["dark", "light", "system"];
let theme = "dark";
try { theme = localStorage.getItem("lanyard-theme-v2") || "dark"; } catch (e) {}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme-btn").textContent = `Theme: ${t}`;
  for (const id of ["c-dec", "c-why"]) { const el = document.getElementById(id); if (el) el._key = null; }
}
applyTheme(theme);
document.getElementById("theme-btn").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); render();
  try { localStorage.setItem("lanyard-theme-v2", theme); } catch (e) {}
};

setInterval(() => document.querySelectorAll(".ago").forEach(s => { s.textContent = ago(+s.dataset.ts); }), 1000);
addEventListener("hashchange", go);
addEventListener("resize", () => { if (route === "overview") render(); });
go(); poll(); loadPolicy();
setInterval(poll, 1000);
setInterval(loadPolicy, 30000);
</script>
</body>
</html>
